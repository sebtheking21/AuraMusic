<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Aura Music</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#aura-frame{display:block;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="aura-frame" src="legacy.html" title="Aura Music"></iframe>
<script>
(function(){
const frame=document.getElementById('aura-frame');
const css=`
html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
body{height:100dvh!important}
#app-container{width:100%!important;max-width:100%!important;height:100dvh!important;min-width:0!important}
@media(max-width:900px){
 :root{--sidebar-width:0px;--player-height:76px!important}
 #app-container{display:flex!important;flex-direction:column!important}
 .sidebar{display:none!important}
 .main-viewport{width:100%!important;min-width:0!important;flex:1!important;overflow:hidden!important}
 .top-header{height:58px!important;padding:0 14px!important;gap:10px!important}
 .header-search{width:min(100%,420px)!important;flex:1!important}
 .header-search input{font-size:14px!important;padding:9px 12px 9px 38px!important}
 .yt-status-badge{padding:5px 9px!important;font-size:11px!important;white-space:nowrap!important}
 .view-container{padding:18px 14px calc(var(--player-height) + 18px)!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
 .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
 .media-card{min-width:0!important;padding:10px!important}
 .media-card:hover{transform:none!important}
 .section-title{font-size:1.2rem!important;margin-bottom:12px!important}
 .song-row{grid-template-columns:34px 44px minmax(0,1fr) auto!important;gap:8px!important;padding:7px 8px!important}
 .song-row>:nth-child(4),.song-row>:nth-child(5){display:none!important}
 .song-row .row-actions{gap:2px!important}
 .dropzone{padding:28px 16px!important}
}
@media(max-width:520px){
 .top-header{height:54px!important;padding:0 10px!important}
 .yt-status-badge{display:none!important}
 .view-container{padding:14px 10px calc(var(--player-height) + 14px)!important}
 .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}
 .media-card{border-radius:12px!important;padding:8px!important}
 .media-card .thumb-box{margin-bottom:8px!important}
 .media-card .card-title{font-size:.85rem!important}
 .media-card .card-sub{font-size:.72rem!important}
 .song-row .row-num{font-size:.75rem!important}
 .song-row .row-thumb{width:40px!important;height:40px!important}
}
@media(min-width:901px){#app-container{min-width:720px!important}}
/* Keep music videos collapsed on every screen */
iframe,video{max-width:100%}
`;
function inject(){try{const d=frame.contentDocument||frame.contentWindow.document;if(!d||!d.head)return;let s=d.getElementById('aura-responsive-wrapper-style');if(!s){s=d.createElement('style');s.id='aura-responsive-wrapper-style';d.head.appendChild(s)}s.textContent=css;try{d.documentElement.style.setProperty('--vh','1vh')}catch(e){} }catch(e){}}
frame.addEventListener('load',()=>{inject();setTimeout(inject,300);setTimeout(inject,1200)});
window.addEventListener('resize',inject);
})();
</script>
</body>
</html>
